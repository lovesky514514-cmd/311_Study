<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>311背书助手</title>
<link rel="icon" href="./favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./style.css?v=2.3.0-lite">
</head>
<body>
<header class="fixed-header">
  <div class="bar">
    <b>311背书助手</b>
    <nav>
      <button class="tab active" data-view="ask">问答</button>
      <button class="tab" data-view="recall">背诵</button>
      <button class="tab" data-view="quiz">刷题</button>
      <button class="tab" data-view="wrong">错题</button>
    </nav>
  </div>
</header>

<main>
  <section id="view-ask" class="view active">
    <div class="askbox">
      <textarea id="question" rows="2" placeholder="输入问题"></textarea>
      <button id="askBtn">搜索</button>
    </div>

    <section class="random-kp">
      <div class="random-head"><b>随机知识点</b><button id="refreshKnowledge" class="link">刷新</button></div>
      <div id="knowledgeList" class="knowledge-list"></div>
    </section>

    <section id="answerBox" class="answer hidden">
      <div class="answer-title">回答</div>
      <ol id="answerList"></ol>
      <div id="answerQuiz" class="inline-quiz hidden"></div>
      <details id="answerExplain" class="explain hidden">
        <summary>AI解释</summary>
        <div id="answerExplainBody"></div>
      </details>
    </section>

    <div id="relatedHead" class="related-head hidden">
      <b>关联搜索</b><span id="relatedCount"></span>
    </div>
    <div id="results" class="results"></div>
  </section>

  <section id="view-recall" class="view">
    <div class="simple-head"><b>背诵</b><button id="randomRecall" class="link">随机</button></div>
    <div id="recallEmpty" class="empty hidden">暂无内容</div>
    <article id="recallCard" class="recall hidden">
      <div id="recallSource" class="meta"></div>
      <div id="recallPrompt" class="prompt"></div>
      <div id="recallInputs" class="fill-list"></div>
      <div class="actions">
        <button id="checkRecall" class="primary">检查</button>
        <button id="showRecall" class="minor">答案</button>
        <button id="alternateRecall" class="minor">换挖法</button>
        <button id="recallWrong" class="minor">加入错题</button>
        <button id="deleteRecall" class="link danger">下一题</button>
      </div>
      <div id="recallFeedback" class="feedback hidden"></div>
      <div id="recallAnswer" class="source hidden"></div>
      <details class="explain"><summary>AI解释</summary><div id="recallExplain"></div></details>
    </article>
    <div id="recallList" class="mini-list"></div>
  </section>


  <section id="view-quiz" class="view">
    <div class="simple-head">
      <b>刷题</b>
      <div class="quiz-head-actions"><span id="quizCount" class="meta"></span><button id="randomQuiz" class="link">随机一题</button></div>
    </div>

    <div class="quiz-filterbar">
      <select id="quizSource" aria-label="来源">
        <option value="">全部来源</option>
        <option value="应试题库">应试题库</option>
        <option value="历年真题">历年真题</option>
      </select>
      <select id="quizSubject" aria-label="科目">
        <option value="">全部科目</option>
        <option value="中国教育史">中国教育史</option>
        <option value="外国教育史">外国教育史</option>
        <option value="教育心理学">教育心理学</option>
        <option value="教育学原理">教育学原理</option>
        <option value="教育研究方法">教育研究方法</option>
      </select>
      <select id="quizType" aria-label="题型">
        <option value="">全部题型</option>
        <option value="choice">选择题</option>
        <option value="judgment">辨析题</option>
        <option value="short">简答题</option>
        <option value="essay">论述/材料题</option>
        <option value="subjective">其他主观题</option>
      </select>
      <select id="quizStatus" aria-label="校验状态">
        <option value="">全部状态</option>
        <option value="gradeable">可判分/有参考答案</option>
        <option value="pending">待校验</option>
      </select>
      <input id="quizKeyword" type="search" placeholder="搜题干 / 年份 / 知识点">
      <button id="applyQuizFilter" class="minor">筛选</button>
    </div>
    <div id="quizPoolMeta" class="quiz-pool-meta"></div>

    <article id="quizCard" class="quiz-card">
      <div id="quizTopic" class="meta"></div>
      <div id="quizStatusLine" class="quiz-status-line"></div>
      <div id="quizQuestion" class="quiz-question"></div>
      <div id="quizOptions" class="quiz-options"></div>

      <div id="subjectiveArea" class="subjective-area hidden"><div id="subjectiveSourcePanel"></div>
        <textarea id="subjectiveAnswer" rows="8" placeholder="先自己写答题要点，再看参考答案"></textarea>
        <div class="subjective-actions">
          <button id="showSubjectiveRef" class="minor">查看参考答案</button>
          <button id="subjectiveKnow" class="minor">我会了</button>
          <button id="subjectiveWrong" class="minor">加入错题</button>
        </div>
        <div id="subjectiveReference" class="source hidden"></div>
      </div>

      <div id="quizFeedback" class="quiz-feedback hidden"></div>
      <details id="quizExplain" class="explain hidden"><summary>解析 / 参考答案</summary><div id="quizExplainBody"></div></details>
      <div class="quiz-actions">
        <button id="nextQuiz" class="primary">下一题</button>
        <button id="quizAddWrong" class="minor">加入错题</button>
      </div>
    </article>
  </section>

  <section id="view-wrong" class="view">
    <div class="simple-head"><b>错题</b><button id="clearWrong" class="link danger">清空</button></div>
    <div id="wrongList" class="wrong-list"></div>
  </section>
</main>

<div id="toast" class="toast"></div>
<script src="./app.js?v=2.3.0-lite"></script>
</body>
</html>
